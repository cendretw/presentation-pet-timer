<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 260px;
      padding: 15px;
      font-family: '微軟正黑體', sans-serif;
      background-color: #fff9fa;
      color: #333;
    }
    h3 { margin-top: 0; margin-bottom: 12px; color: #ff758f; text-align: center; }
    .mode-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    .mode-btn {
      width: 100%;
      padding: 8px 10px;
      border: 1.5px solid #ffb6c1;
      border-radius: 8px;
      background: white;
      color: #555;
      font-weight: bold;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn:hover {
      background: #fff0f3;
    }
    .mode-btn.active {
      background: #ff758f;
      color: white;
      border-color: #ff758f;
    }
    .field { margin-bottom: 12px; }
    label.field-label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; }
    input[type="time"], input[type="number"], select {
      width: 100%;
      padding: 6px;
      border: 1px solid #ffb6c1;
      border-radius: 6px;
      box-sizing: border-box;
    }
    #timerSettings {
      background: #ffeef2;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .save-btn {
      width: 100%;
      padding: 8px;
      background: #ff5c7c;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .save-btn:hover { background: #e64867; }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #2b9348;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h3>🐾 簡報寵物控制中心</h3>

  <div class="mode-group">
    <button class="mode-btn" id="modeAccompany" data-mode="accompany">🐾 純陪伴模式（出現但不提醒）</button>
    <button class="mode-btn" id="modeRemind" data-mode="remind">⏰ 簡報提醒模式（定時檢查狀況）</button>
    <button class="mode-btn" id="modeOff" data-mode="off">💤 休息關閉模式（隱藏小寵物）</button>
  </div>
  
  <div class="field" id="petSelectSection">
    <label class="field-label">選擇陪伴你的小夥伴：</label>
    <select id="petType">
      <option value="cat">🐱 可愛小貓咪</option>
      <option value="fish">🐠 魚缸小金魚</option>
      <option value="groundhog">🐹 尖叫土撥鼠</option>
      <option value="sloth">🦥 慢活小樹懶</option>
    </select>
  </div>

  <div id="timerSettings">
    <div class="field">
      <label class="field-label">簡報開始時間：</label>
      <input type="time" id="startTime">
    </div>

    <div class="field">
      <label class="field-label">每幾分鐘提醒一次：</label>
      <input type="number" id="intervalMins" value="25" min="1" max="180">
    </div>

    <button class="save-btn" id="saveBtn">開始計時 / 儲存時間</button>
  </div>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
